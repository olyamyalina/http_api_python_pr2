[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ean8-service"
version = "0.1.0"
description = "Variant 15: asynchronous EAN-8 PDF generation"
requires-python = ">=3.11"
dependencies = ["bottle==0.13.4", "reportlab==5.1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7", "coverage>=7,<8",
        "WebTest==3.0.7", "pymupdf>=1.24,<2"]

[project.scripts]
ean8-cli = "ean8_service.cli:main"
ean8-server = "ean8_service.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ean8_service"]

[tool.coverage.report]
show_missing = true
